name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]

    defaults:
      run:
        working-directory: tooling

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: tooling/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build all formats
        run: npx tsx build.ts --clean

      - name: Run integration tests
        run: npx tsx test-build.ts --verbose

      - name: Library tests
        run: npx tsx test-lib.ts --verbose

      - name: Security tests
        run: npx tsx test-security.ts --verbose

      - name: Security audit
        run: npm audit --audit-level=high

      - name: SBOM drift check
        if: matrix.node-version == 22
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.ci.cdx.json --output-reproducible
          python3 - <<'PY'
          import json, sys
          a = json.load(open('sbom.cdx.json')); b = json.load(open('sbom.ci.cdx.json'))
          import re
          platform = re.compile(r'(%40esbuild/|%40rollup/rollup-|%40typescript/typescript-(?!7)|%40typescript/typescript-[a-z0-9]+-[a-z0-9]+@|/fsevents@)')
          key = lambda d: sorted((c.get('purl') or c.get('name')) for c in d.get('components', []) if not platform.search(c.get('purl') or c.get('name') or ''))
          if key(a) != key(b):
              print('::error::sbom.cdx.json is out of date; run: cd tooling && npm run sbom'); sys.exit(1)
          print('SBOM components match:', len(key(a)))
          PY

      - name: Validate SBOM
        run: |
          if [ -f sbom.cdx.json ]; then
            echo "SBOM present: $(python3 -c "import json; d=json.load(open('sbom.cdx.json')); print(f'{d[\"bomFormat\"]} {d[\"specVersion\"]}, {len(d.get(\"components\",[]))} components')")"
          else
            echo "::warning::SBOM not found - run: npx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json"
          fi

